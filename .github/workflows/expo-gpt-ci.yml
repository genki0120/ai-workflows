name: Expo GPT CI

on:
  workflow_call:
    inputs:
      package-manager:
        description: Package manager used by the caller repository (npm or pnpm)
        required: false
        type: string
        default: "npm"
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "24"
      eas-channel:
        description: EAS Update channel
        required: false
        type: string
        default: "production"
      eas-environment:
        description: EAS environment
        required: false
        type: string
        default: "production"
    secrets:
      EXPO_TOKEN:
        description: Expo access token supplied by the caller repository
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate GPT changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Validate package manager
        shell: bash
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm) ;;
            *)
              echo "Unsupported package manager: ${{ inputs.package-manager }}"
              exit 1
              ;;
          esac

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run lint
          else
            npm run lint
          fi

      - name: TypeScript check
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec tsc --noEmit
          else
            npx tsc --noEmit
          fi

      - name: Tests
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run test:ci
          else
            npm run test:ci
          fi

      - name: Expo Doctor
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm dlx expo-doctor
          else
            npx expo-doctor
          fi

      - name: Expo Export
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec expo export
          else
            npx expo export
          fi

  eas-update:
    name: EAS Update
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        run: >
          eas update
          --channel "${{ inputs.eas-channel }}"
          --environment "${{ inputs.eas-environment }}"
          --message "GPT CI ${{ github.sha }}"
          --non-interactive
