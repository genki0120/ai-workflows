name: Expo GPT CI

on:
  workflow_call:
    inputs:
      package-manager:
        description: Package manager used by the caller repository (npm or pnpm)
        required: false
        type: string
        default: "npm"
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "24"
      lint-command:
        description: Optional lint command override
        required: false
        type: string
        default: ""
      typecheck-command:
        description: Optional typecheck command override
        required: false
        type: string
        default: ""
      test-command:
        description: Optional test command override
        required: false
        type: string
        default: ""
      expo-enabled:
        description: Run Expo Doctor, Expo Export, and EAS Update
        required: false
        type: boolean
        default: true
      expo-directory:
        description: Directory where Expo commands should run
        required: false
        type: string
        default: "."
      eas-channel:
        description: EAS Update channel
        required: false
        type: string
        default: "production"
      eas-environment:
        description: EAS environment
        required: false
        type: string
        default: "production"
    secrets:
      EXPO_TOKEN:
        description: Expo access token supplied by the caller repository
        required: false

permissions:
  contents: read
  statuses: write

jobs:
  validate:
    name: Validate GPT changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Validate package manager
        shell: bash
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm) ;;
            *)
              echo "Unsupported package manager: ${{ inputs.package-manager }}"
              exit 1
              ;;
          esac

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        shell: bash
        run: |
          if [ -n "${{ inputs.lint-command }}" ]; then
            eval "${{ inputs.lint-command }}"
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run lint
          else
            npm run lint
          fi

      - name: TypeScript check
        shell: bash
        run: |
          if [ -n "${{ inputs.typecheck-command }}" ]; then
            eval "${{ inputs.typecheck-command }}"
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec tsc --noEmit
          else
            npx tsc --noEmit
          fi

      - name: Tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-command }}" ]; then
            eval "${{ inputs.test-command }}"
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run test:ci
          else
            npm run test:ci
          fi

      - name: Expo Doctor
        if: ${{ inputs.expo-enabled }}
        working-directory: ${{ inputs.expo-directory }}
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm dlx expo-doctor
          else
            npx expo-doctor
          fi

      - name: Expo Export
        if: ${{ inputs.expo-enabled }}
        working-directory: ${{ inputs.expo-directory }}
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec expo export
          else
            npx expo export
          fi

  eas-update:
    name: EAS Update
    if: ${{ inputs.expo-enabled }}
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Verify Expo token
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required when expo-enabled=true"
            exit 1
          fi

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        working-directory: ${{ inputs.expo-directory }}
        run: >
          eas update
          --channel "${{ inputs.eas-channel }}"
          --environment "${{ inputs.eas-environment }}"
          --message "GPT CI ${{ github.sha }}"
          --non-interactive

  report-status:
    name: Report GPT CI status
    if: ${{ always() }}
    needs:
      - validate
      - eas-update
    runs-on: ubuntu-latest

    steps:
      - name: Publish commit status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          EAS_RESULT: ${{ needs.eas-update.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$VALIDATE_RESULT" = "success" ] && { [ "$EAS_RESULT" = "success" ] || [ "$EAS_RESULT" = "skipped" ]; }; then
            STATE="success"
            DESCRIPTION="GPT CI passed"
          else
            STATE="failure"
            DESCRIPTION="GPT CI failed"
          fi

          PAYLOAD=$(jq -n \
            --arg state "$STATE" \
            --arg target_url "$RUN_URL" \
            --arg description "$DESCRIPTION" \
            --arg context "gpt-ci/reusable" \
            '{state:$state,target_url:$target_url,description:$description,context:$context}')

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${COMMIT_SHA}" \
            -d "$PAYLOAD"
