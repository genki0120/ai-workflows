name: Expo GPT CI

on:
  workflow_call:
    inputs:
      package-manager:
        required: false
        type: string
        default: "npm"
      node-version:
        required: false
        type: string
        default: "24"
      install-command:
        required: false
        type: string
        default: ""
      lint-command:
        required: false
        type: string
        default: ""
      typecheck-command:
        required: false
        type: string
        default: ""
      test-command:
        required: false
        type: string
        default: ""
      expo-enabled:
        required: false
        type: boolean
        default: true
      expo-directory:
        required: false
        type: string
        default: "."
      eas-channel:
        required: false
        type: string
        default: "production"
      eas-environment:
        required: false
        type: string
        default: "production"
    secrets:
      EXPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Probe reusable workflow
        run: echo "package-manager=${{ inputs.package-manager }} expo-enabled=${{ inputs.expo-enabled }}"
