name: Expo GPT CI

on:
  workflow_call:
    inputs:
      package-manager:
        description: Package manager used by the caller repository (npm or pnpm)
        required: false
        type: string
        default: "npm"
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "24"
      install-command:
        description: Optional install command override
        required: false
        type: string
        default: ""
      lint-command:
        description: Optional lint command override
        required: false
        type: string
        default: ""
      typecheck-command:
        description: Optional typecheck command override
        required: false
        type: string
        default: ""
      test-command:
        description: Optional test command override
        required: false
        type: string
        default: ""
      expo-enabled:
        description: Run Expo Doctor, Expo Export, and EAS Update
        required: false
        type: boolean
        default: true
      expo-directory:
        description: Directory where Expo commands should run
        required: false
        type: string
        default: "."
      eas-channel:
        description: EAS Update channel
        required: false
        type: string
        default: "production"
      eas-environment:
        description: EAS environment
        required: false
        type: string
        default: "production"
    secrets:
      EXPO_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  validate-and-update:
    name: Validate GPT changes and publish update
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Validate package manager
        shell: bash
        run: |
          case "${{ inputs.package-manager }}" in
            npm|pnpm) ;;
            *)
              echo "Unsupported package manager: ${{ inputs.package-manager }}"
              exit 1
              ;;
          esac

      - name: Setup pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        shell: bash
        run: |
          PM_SPEC=$(node -e "try { process.stdout.write(require('./package.json').packageManager || '') } catch (_) {}")
          if [[ "$PM_SPEC" == pnpm@* ]]; then
            PNPM_VERSION="${PM_SPEC#pnpm@}"
            npm install --global "pnpm@${PNPM_VERSION}"
          else
            npm install --global pnpm@latest
          fi
          pnpm --version

      - name: Install dependencies
        shell: bash
        run: |
          if [ -n "${{ inputs.install-command }}" ]; then
            eval "${{ inputs.install-command }}"
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        shell: bash
        run: |
          if [ -n "${{ inputs.lint-command }}" ]; then
            eval "${{ inputs.lint-command }}"
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run lint
          else
            npm run lint
          fi

      - name: TypeScript check
        shell: bash
        run: |
          if [ -n "${{ inputs.typecheck-command }}" ]; then
            eval "${{ inputs.typecheck-command }}"
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec tsc --noEmit
          else
            npx tsc --noEmit
          fi

      - name: Tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-command }}" ]; then
            eval "${{ inputs.test-command }}"
          elif [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run test:ci
          else
            npm run test:ci
          fi

      - name: Expo Doctor
        if: ${{ inputs.expo-enabled }}
        working-directory: ${{ inputs.expo-directory }}
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm dlx expo-doctor
          else
            npx --yes expo-doctor
          fi

      - name: Expo Export
        if: ${{ inputs.expo-enabled }}
        working-directory: ${{ inputs.expo-directory }}
        shell: bash
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm exec expo export
          else
            npx expo export
          fi

      - name: Verify Expo token
        if: ${{ inputs.expo-enabled }}
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN is required when expo-enabled=true"
            exit 1
          fi

      - name: Publish EAS Update
        if: ${{ inputs.expo-enabled }}
        working-directory: ${{ inputs.expo-directory }}
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm dlx eas-cli@latest update \
              --channel "${{ inputs.eas-channel }}" \
              --environment "${{ inputs.eas-environment }}" \
              --message "GPT CI ${{ github.sha }}" \
              --non-interactive
          else
            npx --yes eas-cli@latest update \
              --channel "${{ inputs.eas-channel }}" \
              --environment "${{ inputs.eas-environment }}" \
              --message "GPT CI ${{ github.sha }}" \
              --non-interactive
          fi
