name: Expo GPT CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "24"
      eas-channel:
        description: EAS Update channel
        required: false
        type: string
        default: "production"
      eas-environment:
        description: EAS environment
        required: false
        type: string
        default: "production"
    secrets:
      EXPO_TOKEN:
        description: Expo access token supplied by the caller repository
        required: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate GPT changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test:ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Expo Export
        run: npx expo export

  eas-update:
    name: EAS Update
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish EAS Update
        run: >
          eas update
          --channel "${{ inputs.eas-channel }}"
          --environment "${{ inputs.eas-environment }}"
          --message "GPT CI ${{ github.sha }}"
          --non-interactive
